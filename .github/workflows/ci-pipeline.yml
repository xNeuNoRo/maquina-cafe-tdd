name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore MaquinaCafe.sln

      - name: Compilar proyecto
        run: dotnet build MaquinaCafe.sln --configuration Release --no-restore

      - name: Ejecutar pruebas TDD
        run: dotnet test MaquinaCafe.sln --configuration Release --no-build --no-restore
